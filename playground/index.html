<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAP Marketplace Playground</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
    h1 { color: #1a1a2e; }
    .card { background: #f5f5f5; padding: 20px; border-radius: 8px; margin: 20px 0; }
    input, textarea { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #4361ee; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #3a56d4; }
    pre { background: #1e1e1e; color: #d4d4d4; padding: 16px; border-radius: 8px; overflow-x: auto; }
    .status { padding: 8px; border-radius: 4px; margin: 8px 0; }
    .status.ok { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>TAP Marketplace Playground</h1>
  <p>Paste a signed request from the verify-example and see the decision.</p>

  <div class="card">
    <h3>1. Health Check</h3>
    <button onclick="checkHealth()">Check Health</button>
    <div id="health-status"></div>
  </div>

  <div class="card">
    <h3>2. Verify a Signed Request</h3>
    <textarea id="sig-header" rows="3" placeholder="Signature header value..."></textarea>
    <textarea id="sig-input" rows="3" placeholder="Signature-Input header value..."></textarea>
    <button onclick="verify()">Verify Request</button>
    <div id="verify-result"></div>
  </div>

  <div class="card">
    <h3>3. Create a Task</h3>
    <input id="task-owner" placeholder="Owner ID (agent.tap_agent_id)" />
    <input id="task-reward" placeholder="Reward in OUSD micro-units (e.g., 1000000)" />
    <input id="task-title" placeholder="Task title" />
    <button onclick="createTask()">Create Task</button>
    <pre id="task-result"></pre>
  </div>

  <script>
    const API = window.location.origin

    async function checkHealth() {
      const res = await fetch(API + '/health')
      const data = await res.json()
      const el = document.getElementById('health-status')
      el.className = 'status ' + (res.ok ? 'ok' : 'error')
      el.textContent = JSON.stringify(data, null, 2)
    }

    async function verify() {
      const sig = document.getElementById('sig-header').value
      const input = document.getElementById('sig-input').value
      const res = await fetch(API + '/agents/test/status', {
        headers: { 'Signature': sig, 'Signature-Input': input }
      })
      const data = await res.json()
      const el = document.getElementById('verify-result')
      el.className = 'status ' + (res.ok ? 'ok' : 'error')
      el.textContent = JSON.stringify(data, null, 2)
    }

    async function createTask() {
      const owner = document.getElementById('task-owner').value
      const reward = document.getElementById('task-reward').value
      const title = document.getElementById('task-title').value
      const res = await fetch(API + '/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ownerId: owner, rewardOistr: reward, title: title })
      })
      const data = await res.json()
      document.getElementById('task-result').textContent = JSON.stringify(data, null, 2)
    }
  </script>
</body>
</html>
